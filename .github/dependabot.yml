# Keep pinned GitHub Actions SHAs in trykA123/ci current with one weekly grouped PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    labels: [dependencies]
    groups:
      all:
        patterns: ["*"]
